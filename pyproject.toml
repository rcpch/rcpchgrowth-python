[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rcpchgrowth"
version = "4.6.3"

description = "SDS and Centile calculations for UK Growth Data"
keywords = ["growth charts", "anthropometry", "SDS", "centile", "UK-WHO", "UK90", "Trisomy 21", "Turner", "CDC"]
license = "AGPL-3.0-or-later"
authors = [
  { name = "RCPCH Incubator", email = "incubator@rcpch.ac.uk" },
]
maintainers = [
  { name = "RCPCH Incubator", email = "incubator@rcpch.ac.uk" },
]
requires-python = ">=3.10"
dependencies = [
  "python-dateutil",
  "scipy>=1.15",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

[project.urls]
Homepage = "https://github.com/rcpch/rcpchgrowth-python"
"Bug Reports" = "https://github.com/rcpch/rcpchgrowth-python/issues"
"API management" = "https://dev.rcpch.ac.uk"
Documentation = "https://growth.rcpch.ac.uk/products/python-library/"

[project.optional-dependencies]
notebook = [
  "pandas>=2.2",
  "matplotlib>=3.10",
  "jupyterlab",
  "ipykernel",
  "nbconvert==7.17.1",
]
# Everything needed to run the test suite and release tooling. This is the
# SINGLE source of truth for test dependencies: every environment (local,
# PR CI, and the PyPI publish workflow) installs `.[dev]` so they cannot
# drift apart. `pandas` is required by rcpchgrowth/tests/test_who.py.
dev = [
  "pytest",
  "pandas>=2.2",
  "bump-my-version",
  "build",
  "ruff>=0.16.5",
]

[tool.ruff]
target-version = "py310"
extend-exclude = [
  "rcpchgrowth/tests/who_test_data/who_chart_precalculated_centiles.py",
]

[tool.ruff.lint]
# Start with correctness rules that the existing tree passes. Broader rule
# families remain available as an audit and can be adopted in reviewed groups.
select = ["E9", "F63", "F7", "F82"]

[tool.ruff.lint.per-file-ignores]
# R1 tracks the broken public plotting function; quarantine that known defect
# without allowing it to hide new undefined names elsewhere.
"rcpchgrowth/dynamic_growth.py" = ["F821"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["rcpchgrowth*"]
exclude = ["notebooks"]

[project.readme]
file = "README.md"
content-type = "text/markdown"

[tool.setuptools.package-data]
rcpchgrowth = ["data_tables/**/*.csv", "data_tables/**/*.json", "data_tables/**/*.xls", "data_tables/**/*.pdf", "data_tables/**/*.bas", "data_tables/**/*.xlsx"]

# Version bumping. `version` above is the single source of truth; this keeps
# the duplicated version in CITATION.cff (and its release date) in sync so it
# can never drift again, as it had (stuck at 3.1.17 for years).
#
# `s/version++` is the optional automated release-preparation path. To run the
# underlying bump directly (with the [dev] extra installed):
#   bump-my-version bump patch   # 4.6.0 -> 4.6.1
#   bump-my-version bump minor   # 4.6.0 -> 4.7.0
#   bump-my-version bump major   # 4.6.0 -> 5.0.0
# Add --dry-run --verbose to preview. commit/tag are left off deliberately so
# the version bump stays reviewable on release/vX.Y.Z. Merging that PR with a
# merge commit triggers the validated tag, GitHub Release, and publish cascade.
[tool.bumpversion]
current_version = "4.6.3"
allow_dirty = true
commit = false
tag = false

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = "version = \"{current_version}\""
replace = "version = \"{new_version}\""

[[tool.bumpversion.files]]
filename = "CITATION.cff"
search = "version: {current_version}"
replace = "version: {new_version}"

# date-released is not a version number, so match any ISO date and stamp today.
# Braces in the regex are doubled because search is a format string first.
[[tool.bumpversion.files]]
filename = "CITATION.cff"
regex = true
search = "date-released: \\d{{4}}-\\d{{2}}-\\d{{2}}"
replace = "date-released: {now:%Y-%m-%d}"
